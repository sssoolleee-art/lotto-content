name: update draws
on:
  schedule:
    - cron: '50 11 * * 6'   # 토 20:50 KST
    - cron: '30 12 * * 6'   # 토 21:30 KST
    - cron: '0 1 * * 0'     # 일 10:00 KST (보정)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch.mjs
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data && git diff --cached --quiet || (git commit -m "data: draws update" && git push)
